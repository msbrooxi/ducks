<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ducks: connection test (owner)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 14px; font-size: 0.9rem; color: #444; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 1rem; margin-top: 4px; }
  button { margin-top: 14px; padding: 10px 16px; font-size: 1rem; }
  #log { white-space: pre-wrap; background: #f4f4f4; padding: 10px; margin-top: 16px; border-radius: 6px; font-size: 0.85rem; min-height: 60px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row button { flex: 1; }
</style>
</head>
<body>
<h1>Ducks: connection test (owner)</h1>
<p>This page proves the phone/laptop can talk to your Apps Script and read/write your Drive.
It is a throwaway test page, not the real app.</p>

<label>Web app URL (from Apps Script deploy)
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
</label>
<label>Your owner key
  <input id="key" placeholder="the OWNER_KEY value">
</label>
<p style="font-size:0.8rem;color:#666">Saved only in this browser (localStorage), never sent anywhere but your own script.</p>

<label>Test message
  <input id="message" value="Hello from Ducks">
</label>

<div class="row">
  <button id="save">Save test message</button>
  <button id="load">Load test message</button>
  <button id="checkInbox">Check kid inbox</button>
</div>

<div id="log">Nothing yet.</div>

<script>
const $ = (id) => document.getElementById(id);
const log = (obj) => { $('log').textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2); };

// Remember URL and key across visits, per device.
for (const field of ['url', 'key']) {
  const saved = localStorage.getItem('ducks_' + field);
  if (saved) $(field).value = saved;
  $(field).addEventListener('change', () => localStorage.setItem('ducks_' + field, $(field).value.trim()));
}

async function post(action, extra) {
  const url = $('url').value.trim();
  const key = $('key').value.trim();
  if (!url || !key) { log('Fill in the web app URL and your key first.'); return; }
  log('Sending...');
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, // avoids a CORS preflight
      body: JSON.stringify(Object.assign({ key, action }, extra))
    });
    const data = await res.json();
    log(data);
  } catch (err) {
    log('Request failed: ' + err);
  }
}

$('save').addEventListener('click', () => post('save_test', { message: $('message').value }));
$('load').addEventListener('click', () => post('load_test', {}));
$('checkInbox').addEventListener('click', () => post('check_kid_inbox', {}));
</script>
</body>
</html>

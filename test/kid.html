<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ducks: connection test (kid)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 14px; font-size: 0.9rem; color: #444; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 1rem; margin-top: 4px; }
  button { margin-top: 14px; padding: 10px 16px; font-size: 1rem; }
  #log { white-space: pre-wrap; background: #f4f4f4; padding: 10px; margin-top: 16px; border-radius: 6px; font-size: 0.85rem; min-height: 60px; }
</style>
</head>
<body>
<h1>Ducks: connection test (kid)</h1>
<p>Throwaway test page for the kid-request idea. Not the real app.</p>

<label>Web app URL (same one as the owner page)
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
</label>
<label>Kid key (a different key than the owner's)
  <input id="key" placeholder="the KID_TEST value">
</label>

<label>What do you need?
  <input id="message" value="Need my permission slip signed">
</label>
<label>Needed by (optional)
  <input id="neededBy" type="date">
</label>

<button id="submit">Submit</button>

<div id="log">Nothing yet.</div>

<script>
const $ = (id) => document.getElementById(id);
const log = (obj) => { $('log').textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2); };

for (const field of ['url', 'key']) {
  const saved = localStorage.getItem('ducks_kid_' + field);
  if (saved) $(field).value = saved;
  $(field).addEventListener('change', () => localStorage.setItem('ducks_kid_' + field, $(field).value.trim()));
}

$('submit').addEventListener('click', async () => {
  const url = $('url').value.trim();
  const key = $('key').value.trim();
  if (!url || !key) { log('Fill in the web app URL and the kid key first.'); return; }
  log('Sending...');
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        key,
        action: 'kid_submit',
        message: $('message').value,
        neededBy: $('neededBy').value || null
      })
    });
    const data = await res.json();
    log(data);
  } catch (err) {
    log('Request failed: ' + err);
  }
});
</script>
</body>
</html>
